{% extends "base.html" %}
{% block title %}Something went wrong — {{ cfg.SITE_NAME }}{% endblock %}
{% block content %}
<section class="section section--ink error-page">
  <div class="wrap">
    <p class="eyebrow">500</p>
    <h1 class="error-page__title">Something skipped a beat.</h1>
    <p class="error-page__lede">Try again in a moment, or reach the team directly on WhatsApp.</p>
    <a class="btn btn--primary" href="{{ cfg.WHATSAPP_URL }}" target="_blank" rel="noopener">Message on WhatsApp</a>
  </div>
</section>
{% endblock %}
